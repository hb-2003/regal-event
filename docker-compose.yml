version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: regaladmin
      POSTGRES_PASSWORD: regalpassword
      POSTGRES_DB: regal_events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regaladmin -d regal_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs TypeORM migrations once, then exits. App waits for this to succeed.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://regaladmin:regalpassword@db:5432/regal_events
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://regaladmin:regalpassword@db:5432/regal_events
      JWT_SECRET: your-very-secure-jwt-secret-key-12345
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_USER: your@gmail.com
      EMAIL_PASS: your-app-password
      EMAIL_FROM: Regal Event London <noreply@regalevent.co.uk>
      ADMIN_EMAIL: admin@regalevent.co.uk
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
